name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-tests:
    name: Contract tests
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run contract tests
        shell: powershell
        run: .\tests\Invoke-ScriptTests.ps1

      - name: Run change-record behaviour tests
        shell: powershell
        run: .\tests\Invoke-StateRecordTests.ps1

      # Validates the VM harness's catalog extraction and diff engine against the real optimizer.
      # It needs no admin and changes nothing, so it belongs here rather than in the VM run.
      - name: Round-trip harness self-test
        shell: powershell
        run: .\tests\vm\Invoke-RoundTripTest.ps1 -SelfTest

  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PSScriptAnalyzer is available
        shell: powershell
        run: |
          # windows-latest images usually ship PSScriptAnalyzer already. When they don't, a fresh
          # runner has no PSGallery repository registered yet, so register it before installing -
          # assuming it exists is what broke this job the first time.
          if (Get-Module -ListAvailable -Name PSScriptAnalyzer) {
              Write-Host 'PSScriptAnalyzer is already available on this runner.'
          } else {
              Install-PackageProvider -Name NuGet -Force -Scope CurrentUser -ErrorAction SilentlyContinue
              if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
                  Register-PSRepository -Default -ErrorAction Stop
              }
              Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
              Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -ErrorAction Stop
          }

      - name: Analyze scripts
        shell: powershell
        run: |
          # -Path takes a single value, so the two folders are analyzed separately.
          $findings = @()
          foreach ($folder in @('scripts', 'tests')) {
              $findings += Invoke-ScriptAnalyzer -Path $folder -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          }
          if ($findings) {
              $findings | Format-Table -AutoSize | Out-String | Write-Host
              Write-Host "PSScriptAnalyzer reported $($findings.Count) finding(s)."
              exit 1
          }
          Write-Host 'PSScriptAnalyzer found no issues.'
